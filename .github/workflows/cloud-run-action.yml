name: Docker Build and Deploy to Google Cloud Run

on:
  push:
    branches:
      - main # Change this to your main branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@master
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Build Docker image
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/your-app-name:${{ github.sha }} .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/your-app-name:${{ github.sha }}

    - name: Deploy to Google Cloud Run
      run: |
        gcloud run deploy your-app-name \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/your-app-name:${{ github.sha }} \
          --platform managed \
          --region us-central1 # Change this to your desired region
          --allow-unauthenticated # Remove this if you want authentication

